<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <!-- FLOATING NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
    <a href="about.html" class="nav-btn"><i class="fa-solid fa-address-card"></i> About</a>

  </nav>

  <div class="portfolio-wrapper">
    <!-- CONTACT SECTION -->
    <section id="contact" class="glass-card">
      <div class="contact-grid">
        <div class="contact-left">
          <h2>Get In Touch</h2>
          <p>Let's collaborate! I am always open to discussing new projects, technical ideas, or development opportunities.</p>

          <div class="contact-details-list">
            <div class="contact-item">
              <i class="fa-solid fa-envelope"></i>
              <span>sushantjanwade89@gmail.com</span>
            </div>
            <div class="contact-item">
              <i class="fa-solid fa-phone"></i>
              <span>+91 9518363330</span>
            </div>
            <div class="contact-item">
              <i class="fa-solid fa-location-dot"></i>
              <span>Latur, Maharashtra, India</span>
            </div>
          </div>

          <div class="contact-socials">
            <a href="https://github.com/sushantjanwade" target="_blank" class="social-btn"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="social-btn"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="https://wa.me/919518XXXXXX" target="_blank" class="social-btn"><i class="fa-brands fa-whatsapp"></i></a>
          </div>
        </div>

        <form class="contact-form" id="contact-form">
          <input type="text" id="user_name" class="input-field" placeholder="Your Name" required />
          <input type="email" id="user_email" class="input-field" placeholder="Your Email" required />
          <textarea id="user_msg" class="input-field" placeholder="Your Message" required></textarea>
          <button type="submit" class="btn-submit">Send Message</button>
        </form>
      </div>
    </section>
  </div>

  <script src="js/main.js"></script>
